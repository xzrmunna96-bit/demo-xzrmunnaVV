urgent(){return head("urgent")+demoBar("urgent")+`<div class="card tw"><table><tr><th>${L("Patient|রোগী")}</th><th>${L("Group|গ্রুপ")}</th><th>${L("Place|স্থান")}</th><th>${L("Details|বিবরণ")}</th><th>${L("Phone|ফোন")}</th><th>${L("Type|ধরন")}</th><th></th></tr>${Q.map(q=>`<tr><td>${esc(q.name)}<br><small>${esc(q.problem)}</small></td><td><span class="tag">${esc(q.group)}</span></td><td>${esc(q.place||q.hospital)}</td><td><small>${[q.age?L("Age|বয়স")+": "+esc(q.age):"",q.hb?"Hb: "+esc(q.hb):"",q.amount?L("Amount|পরিমাণ")+": "+esc(q.amount):"",q.date?esc(q.date)+(q.time?" "+esc(q.time):""):"",q.relation?L("Relation|সম্পর্ক")+": "+esc(q.relation):""].filter(Boolean).join("<br>")}</small></td><td>${esc(q.phone)}${q.adminPhone?`<br><small>📞 ${esc(q.adminPhone)}</small>`:""}</td><td>${q.st==="done"?'<span class="tag ok">done</span>':q.st==="approved"?'<span class="tag ok">approved</span>':'<span class="tag w">pending</span>'}<br>${q.emergency?'<span class="tag">emergency</span>':""}</td><td>${q.st==="done"?"":`<button class="s" onclick="approveQ('${q.id}')">${q.st==="approved"?L("Edit contact|নম্বর বদলান"):L("Approve|অনুমোদন")}</button> `}${q.st==="done"?"":`<button class="s" onclick="doneQ('${q.id}')">${L("Fulfilled|সম্পন্ন")}</button> `}<button class="s k" onclick="rmQ('${q.id}')">${L("Delete|মুছুন")}</button></td></tr>`).join("")||`<tr><td colspan=7>${L("No requests yet|কোনো রিকোয়েস্ট নেই")}</td></tr>`}</table></div>`},

 MF=fva(o).sort((a,b)=>(a.ts||0)-(b.ts||0));
 let mx=Math.max(0,...MF.map(x=>+x.serial||0));
 MF.forEach(x=>{if(!x.serial){x.serial=++mx;if(FBU())FB.update("member_forms/"+x._k,{serial:x.serial}).catch(()=>{})}})}
const mfFiltered=()=>{const q=(($("mq")||{}).value||"").trim().toLowerCase(),o=($("mo")||{}).value||"asc";
 let a=MF.filter(x=>!q||[x.name,x.father,x.phone,x.group,x.addr,x.caddr,"#"+x.serial,String(x.serial)].join(" ").toLowerCase().includes(q));
 a=a.slice().sort((x,y)=>o==="desc"?y.serial-x.serial:x.serial-y.serial);return a};

  <div class="tt">সদস্য ফরম</div><div class="gr">${[["name","সদস্য নাম"],["father","পিতার নাম"],["addr","ঠিকানা"],["caddr","বর্তমান ঠিকানা"],["age","বয়স"],["group","রক্তের গ্রুপ"],["weight","ওজন"],["religion","ধর্ম"],["job","পেশা"],["dob","জন্ম তারিখ"],["phone","মোবাইল নাম্বার"],["nid","এনআইডি/নিবন্ধ নাম্বার"],["joined","সদস্য হওয়ার তারিখ"]].map(([k,l])=>`<div class="fl"><small>${l}</small><b>${esc(r[k])||"—"}</b></div>`).join("")}<div class="fl"><small>জমার সময়</small><b>${fdt(r.ts)}</b></div></div>
 <div class="tt">অঙ্গীকার নামা</div><div class="pl"><p>আমি <span class="bl">${r.sign?`<img src="${esc(r.sign)}" alt="">`:"&nbsp;"}</span> এই মরমে অঙ্গীকার করছি যে, ব্লাড ডোনেট সোসাইটি বাংলাদেশ</p><ol><li>এর সকল প্রকার নীতিমালা মেনে নিতে বাধ্য থাকিব।</li><li>সংগঠনের সকল প্রকার সামাজিক কাজ করতে বাধ্য থাকিব।</li><li>সংগঠন থেকে ব্যক্তিগত কোন সুবিধানেওয়ার চেষ্টা করব না।</li><li>আজকে থেকে স্বেচ্ছাসেবী কাজ করব একমাত্র আল্লাহ কে রাজি খুশি করার জন্য।</li></ol><div class="fee">সংগঠনে প্রতিমাসে <em>৫০ টাকা</em> করে ডোনেট করত হবে যে টাকা দিয়ে সামাজিক কাজে ব্যয় করা হবে।</div><p>আমি সংগঠনের সকল নিয়ম মেনে নিয়ে স্বেচ্ছায়, সজ্ঞানে ও সুস্থ মস্তিস্কে স্বাক্ষর করিলাম।</p></div>

const mfGet=k=>MF.find(x=>x._k===k);
function mfDoc(r){return `<!doctype html><html><head><meta charset="utf-8"><title>Member-${String(r.serial).padStart(3,"0")}-${esc(r.name)}</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;800&display=swap" rel="stylesheet"><style>${MFCSS}</style></head><body>${mfSheet(r)}</body></html>`}
function mfView(k){const r=mfGet(k);if(!r)return;let o=$("mfo");if(o)o.remove();
 o=document.createElement("div");o.id="mfo";o.style.cssText="position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);overflow:auto;padding:16px";
 o.innerHTML=`<div style="max-width:800px;margin:0 auto"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button onclick="mfPdf('${esc(k)}')">⬇ ${L("Download PDF|ডাউনলোড (PDF)")}</button><button class="g" onclick="mfSign('${esc(k)}')">🖋 ${L("Signature (PNG)|স্বাক্ষর (PNG)")}</button><button class="k" onclick="mfDel('${esc(k)}')">🗑 ${L("Delete|মুছুন")}</button><button class="g" style="margin-left:auto" onclick="$('mfo').remove()">✕ ${L("Close|বন্ধ")}</button></div><iframe id="mfi" style="width:100%;height:calc(100vh - 90px);min-height:520px;border:0;border-radius:14px;background:#fff"></iframe></div>`;
 o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);$("mfi").srcdoc=mfDoc(r)}
function mfPdf(k){const r=mfGet(k);if(!r)return;const f=document.createElement("iframe");f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";document.body.appendChild(f);
 const d=f.contentWindow.document;d.open();d.write(mfDoc(r));d.close();
 const go=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast(L("Print failed|প্রিন্ট করা যায়নি"))}setTimeout(()=>f.remove(),60000)};

const avOpts=(arr,val,ph)=>`<option value="">${esc(ph)}</option>`+arr.map(x=>`<option ${x===val?"selected":""}>${esc(x)}</option>`).join("");

function avGeo(ch){
  const dv=$("f_division").value,ds=$("f_district"),th=$("f_thana");
  if(ch==="division")ds.innerHTML=avOpts(AV_BD[dv]||[],"",L("Select district|জেলা বেছে নিন"));

  ds.disabled=!dv;th.disabled=!ds.value;
}

window.KD=null;window.KSEL="";window.KQ="";
const khCol=["#8bc34a","#fdc500","#d32f2f","#fb8c3c","#7e57c2","#26a69a","#42a5f5","#ec407a"];
const khKey=n=>String(n||"").trim().toLowerCase();
const khClr=n=>{let h=0;for(const c of String(n||""))h=(h*31+c.codePointAt(0))>>>0;return khCol[h%khCol.length]};
const khIni=n=>([...String(n||"?").trim()][0]||"?").toUpperCase();
function khGroups(){const m={};(KD&&KD.e||[]).forEach(x=>{const k=khKey(x.n);if(!k)return;const g=m[k]||(m[k]={k,n:String(x.n).trim(),p:"",tot:0,list:[],last:""});g.tot+=+x.a||0;g.list.push(x);if(x.p)g.p=x.p;const u=String(x.d||"")+"|"+String(x.ts||0).padStart(15,"0");if(u>g.last)g.last=u});const a=Object.values(m);a.forEach(g=>g.list.sort((x,y)=>(String(y.d).localeCompare(String(x.d)))||((y.ts||0)-(x.ts||0))));return a.sort((x,y)=>y.last.localeCompare(x.last))}
async function khLoad(){try{const v=await FB.get("khata");KD=v||{}}catch(e){KD={};toast("Cloud load failed")}KD.e=(KD.e||[]).filter(Boolean);if(cur==="khata")show("khata")}

function khAdd(){const n=(fdV("khN")||"").trim(),a=+fdV("khA"),d=fdV("khD"),s=(fdV("khS")||"").trim(),p=(fdV("khP")||"").trim();if(!n||!(a>0)||!d||!s){toast(L("Fill name, amount, date and description|নাম, টাকা, তারিখ ও বিবরণ দিন"));return}KD.e.push({id:Date.now().toString(36),n,p,a,d,s,ts:Date.now()});khSave()}
function khFill(){const g=khGroups().find(x=>x.k===khKey(fdV("khN")));if(g&&g.p&&!(fdV("khP")||"").trim())document.getElementById("khP").value=g.p}
function khOpen(i){const g=khGroups()[i];if(!g)return;KSEL=g.k;show("khata");window.scrollTo&&scrollTo(0,0)}
function khBack(){KSEL="";show("khata")}

function khEdit(id){const x=KD.e.find(y=>y.id===id);if(!x)return;const a=prompt(L("Amount|পরিমাণ"),x.a);if(a===null)return;const s=prompt(L("Description|বিবরণ"),x.s);if(s===null)return;const d=prompt(L("Date (YYYY-MM-DD)|তারিখ (YYYY-MM-DD)"),x.d);if(d===null)return;x.a=+a>0?+a:x.a;x.s=s.trim()||x.s;if(/^\d{4}-\d{2}-\d{2}$/.test(d.trim()))x.d=d.trim();khSave()}
function khPrint(i){const g=khGroups()[i];if(!g)return;const w=window.open("","_blank");if(!w)return;w.document.write('<meta charset="utf-8"><title>'+esc(g.n)+'</title><style>body{font-family:sans-serif;padding:18px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:7px;font-size:14px;text-align:left}th{background:#eee}</style><h2>'+esc(g.n)+'</h2><p>'+esc(g.p||"")+'</p><p><b>'+L("Total donation|মোট ডোনেশন")+': \u09f3 '+g.tot.toLocaleString()+'</b></p><table><tr><th>'+L("Date|তারিখ")+'</th><th>'+L("Description|বিবরণ")+'</th><th>'+L("Amount|টাকা")+'</th></tr>'+g.list.map(x=>'<tr><td>'+esc(x.d)+'</td><td>'+esc(x.s)+'</td><td>'+(+x.a).toLocaleString()+'</td></tr>').join("")+'</table>');w.document.close();setTimeout(()=>w.print(),400)}

  ${gs.map((g,i)=>({g,i})).filter(o=>!q||o.g.k.indexOf(q)>-1||String(o.g.p||"").indexOf(q)>-1).map(({g,i})=>`<div onclick="khOpen(${i})" style="display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px dashed #ddd;cursor:pointer"><div style="flex:none;width:44px;height:44px;border-radius:50%;background:${khClr(g.n)};color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px">${esc(khIni(g.n))}</div><div style="flex:1;min-width:0"><b>${esc(g.n)}</b><br><small style="color:#777">${esc(g.list[0].s)} \u00b7 ${fd(g.list[0].d)}</small></div><b style="color:#0f7a38;white-space:nowrap">\u09f3${g.tot.toLocaleString()}</b><span style="color:#999">\u203a</span></div>`).join("")||`<p style="color:#777">${L("No donors yet \u2014 add the first entry above.|এখনো কোনো ডোনার নেই \u2014 উপরে প্রথম এন্ট্রি যোগ করুন।")}</p>`}</div>`;

M.khata=["Donation ledger like a tally khata: who donated, for what purpose and how much.|টালি খাতার মতো ডোনেশন খাতা: কে, কী কাজের জন্য, কত টাকা দিয়েছে।","Members see it live on Home (above the Fund Dashboard): donor list, tap a name to see that donor's full report.|হোমে ফান্ড ড্যাশবোর্ডের ওপরে সবাই লাইভ দেখে: ডোনারের তালিকা, নামে চাপলে তার সব রিপোর্ট।","Type donor name, amount, date and purpose (phone is optional) and Save. Same name = same donor. Tap a donor to edit or delete entries.|ডোনারের নাম, টাকা, তারিখ ও বিবরণ লিখে সেভ করুন (ফোন নম্বর ঐচ্ছিক)। একই নাম = একই ডোনার। ডোনারে চাপলে এন্ট্রি এডিট বা ডিলিট করা যাবে।"];

/* ---- Activities (সোসাইটির কার্যক্রম): works with photo + editable section names ---- */
async function acSave(){try{await FB.set("fund/acts",FD.acts);toast(L("Saved|সেভ হয়েছে"))}catch(e){toast(L("Save failed \u2014 check rules|সেভ হয়নি \u2014 রুলস দেখুন"))}show("acts")}
async function acSaveUi(){const u={};["tBn","tEn","wBn","wEn","bBn","bEn"].forEach(k=>{const v=(fdV("ui_"+k)||"").trim();if(v)u[k]=v});FD.ui=u;try{if(Object.keys(u).length)await FB.set("fund/ui",u);else await FB.remove("fund/ui");toast(L("Saved|সেভ হয়েছে"))}catch(e){toast(L("Save failed \u2014 check rules|সেভ হয়নি \u2014 রুলস দেখুন"))}show("acts")}
async function acAdd(){const t=(fdV("ac_t")||"").trim();if(!t){toast(L("Write what work was done|কী কাজ করা হয়েছে লিখুন"));return}const a=+fdV("ac_a")||0,f=document.getElementById("ac_i"),img=await fdImg(f&&f.files[0]);const r={id:Date.now().toString(36),t,pl:(fdV("ac_p")||"").trim(),s:(fdV("ac_s")||"").trim(),d:fdV("ac_d")||fdDay(0),st:fdV("ac_u")||"done",img:img||""};if(a>0)r.a=a;FD.acts.push(r);acSave()}
function acTog(id){const x=FD.acts.find(y=>y.id===id);if(x){x.st=x.st==="ongoing"?"done":"ongoing";acSave()}}
function acDel(id){if(!confirm(L("Delete this work?|এই কাজটি মুছবেন?")))return;FD.acts=FD.acts.filter(x=>x.id!==id);acSave()}
function acEdit(id){const x=FD.acts.find(y=>y.id===id);if(!x)return;const t=prompt(L("Work done|কী কাজ করা হয়েছে"),x.t);if(t===null)return;const p=prompt(L("Place / mosque name (optional)|স্থান / মসজিদের নাম (ঐচ্ছিক)"),x.pl||"");if(p===null)return;const a=prompt(L("Amount \u09f3 (optional, empty = none)|টাকা \u09f3 (ঐচ্ছিক, ফাঁকা = নেই)"),x.a||"");if(a===null)return;const s=prompt(L("Details (optional)|বিবরণ (ঐচ্ছিক)"),x.s||"");if(s===null)return;x.t=t.trim()||x.t;x.pl=p.trim();x.s=s.trim();if(+a>0)x.a=+a;else delete x.a;acSave()}
async function acImg(id,inp){const x=FD.acts.find(y=>y.id===id);if(!x||!inp.files[0])return;const img=await fdImg(inp.files[0]);if(!img){toast(L("Could not read the photo|ছবি পড়া যায়নি"));return}x.img=img;acSave()}
function acNoImg(id){const x=FD.acts.find(y=>y.id===id);if(!x||!confirm(L("Remove the photo?|ছবি সরাবেন?")))return;x.img="";acSave()}
P.acts=function(){
 if(!FD){fdLoad();return head("acts")+'<div class="card">\u2026</div>'}
 const inp="padding:9px;border:1px solid #ddd;border-radius:9px;font:inherit;max-width:100%",bt="padding:9px 14px;border:0;border-radius:9px;background:#d32f2f;color:#fff;font:inherit;cursor:pointer",sm="padding:5px 9px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:12px";
 const U=FD.ui||{};const uf=(k,ph)=>`<input id="ui_${k}" value="${esc(U[k]||"")}" placeholder="${esc(ph)}" style="${inp};width:100%;box-sizing:border-box">`;
 const acts=FD.acts.slice().sort((x,y)=>String(y.d).localeCompare(String(x.d)));
 return head("acts")+`<div class="card" style="border-left:4px solid #d32f2f"><h3>\ud83d\udcd8 ${L("How it works|কীভাবে কাজ করে")}</h3><ol style="margin:6px 0 0 18px;padding:0;line-height:1.7;font-size:13.5px">
<li>${L("This is the <b>Society Activities</b> block at the very bottom of the Home page. It has two parts: <b>Recent Works</b> on top and <b>Recent Blood Donations</b> below.|এটা হোম পেজের একদম নিচের <b>সোসাইটির কার্যক্রম</b> অংশ। এর দুই ভাগ: ওপরে <b>সাম্প্রতিক কাজ</b>, নিচে <b>সাম্প্রতিক রক্তদান</b>।")}</li>
<li>${L("Add each work here (e.g. <b>Mosque cleaning</b>, place: <b>Baitul Mukarram Mosque</b>). Photo and amount are <b>optional</b>.|এখানে প্রতিটি কাজ যোগ করুন (যেমন <b>মসজিদ পরিষ্কার</b>, স্থান: <b>বায়তুল মোকাররম মসজিদ</b>)। ছবি ও টাকা <b>ঐচ্ছিক</b>।")}</li>
<li>${L("Blood donors are added from <b>Blood \u2192 Donations</b>; they stay in their own part so a mosque photo never gets a blood-group badge.|রক্তদাতারা <b>রক্ত \u2192 ডোনেশন</b> থেকে যোগ হয়; আলাদা ভাগে থাকে, তাই মসজিদের ছবিতে রক্তের গ্রুপের ব্যাজ আসে না।")}</li>
<li>${L("You can rename the three headings below. Leave a box empty to use the default name.|নিচে তিনটা শিরোনামের নাম বদলাতে পারবেন। ঘর ফাঁকা রাখলে ডিফল্ট নাম থাকবে।")}</li></ol></div>
<div class="card"><h3>\u270f\ufe0f ${L("Section names|অংশের নাম")}</h3>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px">
<div><small>${L("Main title (Bangla)|মূল শিরোনাম (বাংলা)")}</small>${uf("tBn","সোসাইটির কার্যক্রম")}</div><div><small>${L("Main title (English)|মূল শিরোনাম (ইংরেজি)")}</small>${uf("tEn","Society Activities")}</div>
<div><small>${L("Works heading (Bangla)|কাজের শিরোনাম (বাংলা)")}</small>${uf("wBn","সাম্প্রতিক কাজ")}</div><div><small>${L("Works heading (English)|কাজের শিরোনাম (ইংরেজি)")}</small>${uf("wEn","Recent Works")}</div>
<div><small>${L("Blood heading (Bangla)|রক্তদানের শিরোনাম (বাংলা)")}</small>${uf("bBn","সাম্প্রতিক রক্তদান")}</div><div><small>${L("Blood heading (English)|রক্তদানের শিরোনাম (ইংরেজি)")}</small>${uf("bEn","Recent Blood Donations")}</div></div>
<div style="margin-top:10px"><button style="${bt}" onclick="acSaveUi()">${L("Save names|নাম সেভ করুন")}</button></div></div>
<div class="card"><h3>\ud83d\udd4c ${L("Add a work|একটি কাজ যোগ করুন")}</h3><div style="display:flex;gap:8px;flex-wrap:wrap">
<input id="ac_t" placeholder="${L("What was done, e.g. Mosque cleaning *|কী কাজ, যেমন মসজিদ পরিষ্কার *")}" style="${inp};flex:2;min-width:220px">
<input id="ac_p" placeholder="${L("Place / mosque name (optional)|স্থান / মসজিদের নাম (ঐচ্ছিক)")}" style="${inp};flex:2;min-width:200px">
<input id="ac_s" placeholder="${L("Details (optional)|বিবরণ (ঐচ্ছিক)")}" style="${inp};flex:3;min-width:240px">
<input id="ac_d" type="date" value="${fdDay(0)}" style="${inp}">
<input id="ac_a" type="number" min="0" placeholder="${L("Amount \u09f3 (optional)|টাকা \u09f3 (ঐচ্ছিক)")}" style="${inp};width:140px">
<select id="ac_u" style="${inp}"><option value="done">${L("Completed|সম্পন্ন")}</option><option value="ongoing">${L("Ongoing|চলমান")}</option></select>
<label style="${inp};cursor:pointer;white-space:nowrap">\ud83d\uddbc <span>${L("Photo from gallery (optional)|গ্যালারি থেকে ছবি (ঐচ্ছিক)")}</span><input id="ac_i" type="file" accept="image/*" style="display:none" onchange="this.previousSibling.textContent=this.files[0]?('\u2705 '+this.files[0].name.slice(0,18)):'${L("Photo from gallery (optional)|গ্যালারি থেকে ছবি (ঐচ্ছিক)")}'"></label>
<button style="${bt}" onclick="acAdd()">${L("Save|সেভ")}</button></div></div>
<div class="card"><h3>${L("Works|কাজের তালিকা")} (${acts.length})</h3>${acts.map(x=>`<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee;flex-wrap:wrap"><div style="width:64px;height:52px;border-radius:9px;background:#f3e2e5 center/cover${x.img?`;background-image:url(${x.img})`:""};display:grid;place-items:center;font-size:22px">${x.img?"":"\ud83e\udd1d"}</div><div style="flex:1;min-width:160px"><b>${esc(x.t)}</b>${x.pl?`<br><small>\ud83d\udccd ${esc(x.pl)}</small>`:""}<br><small>${fd(x.d)}${+x.a>0?" \u00b7 \u09f3"+(+x.a).toLocaleString():""}${x.s?" \u00b7 "+esc(x.s):""}</small></div>
<button style="${sm}" onclick="acTog('${x.id}')">${x.st==="ongoing"?L("Ongoing \u2192 Done|চলমান \u2192 সম্পন্ন"):L("Done|সম্পন্ন")}</button>
<label style="${sm}">${x.img?L("Change photo|ছবি বদলান"):L("Add photo|ছবি দিন")}<input type="file" accept="image/*" style="display:none" onchange="acImg('${x.id}',this)"></label>${x.img?`<button style="${sm}" onclick="acNoImg('${x.id}')">${L("Remove photo|ছবি সরান")}</button>`:""}
<button style="${sm}" onclick="acEdit('${x.id}')">\u270e</button><button style="${sm}" onclick="acDel('${x.id}')">\ud83d\uddd1</button></div>`).join("")||`<p style="color:#777">${L("No works yet \u2014 add the first one above.|এখনো কোনো কাজ নেই \u2014 উপরে প্রথমটি যোগ করুন।")}</p>`}</div>`;
};
M.acts=["Society Activities block at the bottom of Home: recent works (with optional photos) and recent blood donations.|হোমের নিচের সোসাইটির কার্যক্রম অংশ: সাম্প্রতিক কাজ (ঐচ্ছিক ছবিসহ) ও সাম্প্রতিক রক্তদান।","Every member sees it live at the very bottom of Home; works on top, blood donors below.|প্রতিটি সদস্য হোমের একদম নিচে লাইভ দেখে; ওপরে কাজ, নিচে রক্তদাতা।","Fill what was done, place and date, then Save. Photo, amount and details are optional. You can rename the headings too.|কী কাজ, স্থান ও তারিখ লিখে সেভ করুন। ছবি, টাকা ও বিবরণ ঐচ্ছিক। শিরোনামের নামও বদলানো যায়।"];
